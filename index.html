<!DOCTYPE html>
<html>
<head>
  <title>Pookz-n-Pearlz</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #ffd6e7, #ffeef7);
      margin: 0;
      text-align: center;
    }

    h1 {
      background: #ff69b4;
      color: white;
      padding: 18px;
      margin: 0;
      font-size: 28px;
    }

    p {
      color: #444;
    }

    .shop {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }

    .card {
      background: white;
      width: 220px;
      margin: 12px;
      padding: 12px;
      border-radius: 18px;
      box-shadow: 0 0 12px #f5b6d2;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      border-radius: 12px;
    }

    .price {
      color: #e60073;
      font-weight: bold;
    }

    .btn {
      display: inline-block;
      margin-top: 8px;
      padding: 8px;
      background: #ff4da6;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 14px;
    }

    .btn:hover {
      background: #e60073;
    }

  </style>
</head>

<body>

<h1>💖 Pookz-n-Pearlz 💖</h1>
<p>cute handmade pookie bracelets ✨</p>

<div class="shop">

  <div class="card">
    <img src="Screenshot 2026-06-10 12.56.57 AM.png">
    <p>💗 Pink Good Bracelet</p>
    <p class="price">PKR 200</p>
    <a class="btn" href="mailto:ismailbhattig4b@gmail.com?subject=Order Pink Bracelet">Order 💌</a>
  </div>

  <div class="card">
    <img src="Screenshot 2026-06-10 12.56.47 AM.png">
    <p>⭐ Star Bracelet</p>
    <p class="price">PKR 200</p>
    <a class="btn" href="mailto:ismailbhattig4b@gmail.com?subject=Order Star Bracelet">Order 💌</a>
  </div>

  <div class="card">
    <img src="Screenshot 2026-06-10 12.56.38 AM.png">
    <p>💞 Friendship Bracelet</p>
    <p class="price">PKR 200</p>
    <a class="btn" href="mailto:ismailbhattig4b@gmail.com?subject=Order Friendship Bracelet">Order 💌</a>
  </div>

  <div class="card">
    <img src="Screenshot 2026-06-10 12.56.26 AM.png">
    <p>💜 Blue & Purple Duo</p>
    <p class="price">PKR 400</p>
    <a class="btn" href="mailto:ismailbhattig4b@gmail.com?subject=Order Duo Bracelet">Order 💌</a>
  </div>

</div>

</body>
</html>
