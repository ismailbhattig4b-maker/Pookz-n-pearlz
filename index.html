<!DOCTYPE html>
<html>
<head>
  <title>Pookz-n-Pearlz</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4ff;
      margin: 0;
      text-align: center;
    }

    h1 {
      background: #6a0dad;
      color: white;
      padding: 15px;
      margin: 0;
    }

    .shop {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }

    .card {
      background: white;
      width: 220px;
      margin: 10px;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 0 8px #ccc;
    }

    .card img {
      width: 100%;
      border-radius: 8px;
    }

    .price {
      color: green;
      font-weight: bold;
    }

    .btn {
      display: inline-block;
      margin-top: 8px;
      padding: 8px;
      background: #ff9800;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<h1>🛍 Pookz-n-Pearlz Shop</h1>
<p>Order by Email 📩</p>

<div class="shop">

  <div class="card">
    <img src="Screenshot 2026-06-10 12.56.57 AM.png">
    <p>Pink Good Bracelet</p>
    <p class="price">$3</p>
    <a class="btn" href="mailto:yourgmail@gmail.com?subject=Order Pink Bracelet">Order</a>
  </div>

  <div class="card">
    <img src="Screenshot 2026-06-10 12.56.47 AM.png">
    <p>Bracelet</p>
    <p class="price">$4</p>
    <a class="btn" href="mailto:yourgmail@gmail.com?subject=Order Bracelet">Order</a>
  </div>

  <div class="card">
    <img src="Screenshot 2026-06-10 12.56.38 AM.png">
    <p>Bracelet</p>
    <p class="price">$5</p>
    <a class="btn" href="mailto:yourgmail@gmail.com?subject=Order Bracelet">Order</a>
  </div>

</div>

</body>
</html>
